name: FinZ SEO Workbench QA

on:
  push:
    branches:
      - fix/v1-6-quality-gates-mapping-qa
      - main
  pull_request:
    branches:
      - main
      - fix/v1-6-quality-gates-mapping-qa
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: finz-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-qa:
    name: Backend Regression, Migrations & Serial/Parallel Parity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FINZ_SECRET_BACKEND: memory
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/api/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m venv services/api/.venv
          services/api/.venv/bin/python -m pip install --upgrade pip
          services/api/.venv/bin/pip install -r services/api/requirements.txt

      - name: Verify diff hygiene
        run: git diff --check

      - name: Run serial vs bounded-parallel pytest parity & migration checks
        run: services/api/.venv/bin/python scripts/qa-parallel-check.py

  web-build-and-browser-e2e:
    name: Web Typecheck, Build & Real Headless Chrome E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FINZ_SECRET_BACKEND: memory
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/api/requirements.txt

      - name: Install frontend dependencies (clean lockfile)
        run: npm --prefix apps/web ci

      - name: TypeScript typecheck
        run: npm --prefix apps/web run typecheck

      - name: Install backend runtime for isolated E2E server
        run: |
          python -m venv services/api/.venv
          services/api/.venv/bin/pip install -r services/api/requirements.txt

      - name: Verify Chrome/Chromium binary availability
        id: chrome
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "bin=$(command -v google-chrome)" >> "$GITHUB_OUTPUT"
          elif command -v chromium >/dev/null 2>&1; then
            echo "bin=$(command -v chromium)" >> "$GITHUB_OUTPUT"
          elif command -v chromium-browser >/dev/null 2>&1; then
            echo "bin=$(command -v chromium-browser)" >> "$GITHUB_OUTPUT"
          else
            echo "Chrome/Chromium binary not found on runner" >&2
            exit 1
          fi

      - name: Run headless Chrome E2E (T27-T29, popup negatives, stale freshness & export UI)
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.bin }}
        run: |
          rm -rf apps/web/.next
          node scripts/qa-browser-t27-t29.mjs

      - name: Next.js production build
        run: |
          rm -rf apps/web/.next
          npm --prefix apps/web run build
